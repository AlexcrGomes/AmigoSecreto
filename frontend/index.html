<!doctype html>
<!-- Tema único e claro (feature 005, R55): data-theme impede a Glisse de escurecer sozinha -->
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      O CSS da Glisse vem empacotado com o do app (import em main.tsx). Este marcador impede a
      biblioteca de injetar um <style>, que a CSP (style-src 'self') bloquearia — feature 005, R44.
    -->
    <meta id="glisse-styles" name="glisse-styles" content="bundled" />
    <title>Amigo Secreto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
