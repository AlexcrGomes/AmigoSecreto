# Política: dependências só são atualizadas quando há falha de segurança registrada ou quando uma
# funcionalidade nova precisa da versão nova (aí a atualização vai no próprio PR da funcionalidade).
#
# - `open-pull-requests-limit: 0` desliga as atualizações de versão (as "novidades" semanais).
# - Os *security updates* do Dependabot continuam ativos (Settings → Code security): quando sai um
#   alerta para uma dependência do projeto, ele abre um PR com a menor versão que corrige.
#   Funcionam para Maven, npm e GitHub Actions; imagens Docker não têm alertas no GitHub e são
#   cobertas pelo Trivy na varredura semanal do security.yml, que abre uma issue.
# - Cada PR passa pelo CI completo e pela aprovação manual, como qualquer outro.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
