# Atualizações semanais de dependências; cada PR passa pelo CI completo e pela aprovação manual.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-patch:
        update-types: [patch]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /db
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
