openapi: 3.1.0
info:
  title: Amigo Secreto API — mudanças da feature 002
  version: 1.1.0
  description: |
    Somente as rotas e os schemas NOVOS ou ALTERADOS pela feature 002. Todo o resto continua como
    em specs/001-amigo-secreto-sorteio/contracts/openapi.yaml (mesmas regras gerais: cookie de
    sessão, CSRF em escritas, erros RFC 9457 em pt-BR, `404` para quem não é membro).

    Mudanças são ADITIVAS no prefixo `/api/v1`: campos novos nas respostas, rotas novas e o novo
    valor `FINISHED` em `GroupStatus`.

    SIGILO (Constituição I): nenhuma rota nova devolve pares. Pedidos de saída e avisos de
    sorteio desfeito não dizem quem tirou quem, nem quem a pessoa que saiu havia tirado (FR-032).

    Datas do evento: `eventDate` (AAAA-MM-DD) e `eventTime` (HH:mm) são sempre no horário de
    Brasília (America/Sao_Paulo); o servidor converte para UTC (research R13).
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: groups
  - name: confirmation
  - name: draw
  - name: exit-requests

paths:
  /groups:
    get:
      tags: [groups]
      summary: Meus grupos (ALTERADA — cada item ganha a data do evento e pode estar FINISHED)
      responses:
        '200':
          description: Lista; o cliente separa `FINISHED` dos demais (FR-020)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GroupSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [groups]
      summary: Criar grupo (ALTERADA — data e local obrigatórios; FR-001 a FR-003)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGroupRequest' }
      responses:
        '201':
          description: Grupo criado; o organizador já está confirmado
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Data no passado (`/problems/event-date-in-past`) ou horário de hoje já passado (`/problems/event-time-in-past`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /groups/join:
    post:
      tags: [groups]
      summary: Entrar pelo código (ALTERADA — novos motivos de recusa)
      description: Quem entra começa pendente (FR-008). Corpo como na 001.
      responses:
        '200':
          description: Entrou (ou já era membro)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '409':
          description: |
            Além dos motivos da 001: grupo finalizado (`/problems/group-finished`) ou pessoa que
            saiu depois do sorteio (`/problems/rejoin-not-allowed`, FR-030).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /groups/{groupId}/event-details:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    put:
      tags: [groups]
      summary: Organizador altera descrição, data, horário e local (NOVA — FR-005, FR-006, FR-015)
      description: |
        Substitui os quatro campos. Permitida com o grupo `OPEN` ou `DRAWN`.
        Se data, horário ou local mudarem com o grupo `OPEN`, `detailsVersion` aumenta e todos,
        exceto o organizador, voltam a pendente. Com o grupo `DRAWN`, nada muda no sorteio
        (FR-016). Validação de data só quando data ou horário mudam (research R14).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventDetailsRequest' }
      responses:
        '200':
          description: Detalhes salvos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOrganizer' }
        '404': { $ref: '#/components/responses/GroupNotFound' }
        '409': { $ref: '#/components/responses/GroupFinished' }
        '422':
          description: Data no passado ou horário de hoje já passado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /groups/{groupId}/confirmation:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [confirmation]
      summary: O usuário da sessão confirma a própria participação (NOVA — FR-009, FR-010, FR-035)
      description: |
        Sempre o usuário da sessão: não existe parâmetro de usuário (ninguém confirma por outro).
        Idempotente: quem já está confirmado recebe `200` sem mudança.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmationRequest' }
      responses:
        '200':
          description: Confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/GroupNotFound' }
        '409':
          description: |
            `/problems/details-changed` — os detalhes mudaram desde que a tela foi carregada;
            o cliente recarrega o grupo e pede para confirmar de novo (FR-035).
            `/problems/group-already-drawn` ou `/problems/group-finished` — não há mais o que
            confirmar.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /groups/{groupId}/draw:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [draw]
      summary: Sorteio (ALTERADA — novas condições; FR-013)
      description: Verificações na ordem de research R16.
      responses:
        '200':
          description: Sorteio realizado; schema `DrawResult` da 001, sem nenhum par
        '409':
          description: Grupo já sorteado (`/problems/group-already-drawn`) ou finalizado (`/problems/group-finished`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: |
            `/problems/event-details-required` (grupo antigo sem data e local),
            `/problems/event-date-passed`, `/problems/not-enough-participants` ou
            `/problems/participants-pending` (com `pending`: nomes de quem falta confirmar).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/DrawBlockedProblem' }

  /groups/{groupId}/exit-requests:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [exit-requests]
      summary: Participante pede para sair de um grupo sorteado (NOVA — FR-025)
      description: Sem corpo. O sorteio continua valendo enquanto o pedido estiver pendente (FR-027).
      responses:
        '201':
          description: Pedido criado (pendente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExitRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/GroupNotFound' }
        '409':
          description: |
            `/problems/group-not-drawn` (antes do sorteio a pessoa sai direto),
            `/problems/group-finished`, `/problems/organizer-cannot-leave` ou
            `/problems/exit-request-already-pending`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /groups/{groupId}/exit-requests/mine:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    delete:
      tags: [exit-requests]
      summary: O solicitante cancela o próprio pedido pendente (NOVA — FR-025)
      responses:
        '204': { description: Cancelado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Grupo não encontrado, ou não há pedido pendente do usuário
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /groups/{groupId}/exit-requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [exit-requests]
      summary: Organizador aprova — a pessoa sai e o sorteio é desfeito (NOVA — FR-028, FR-030)
      description: |
        Uma transação: participante removido, TODOS os pares apagados, grupo volta a `OPEN`,
        demais pedidos pendentes cancelados, quem saiu impedido de voltar. A resposta não tem
        pares e não diz quem a pessoa havia tirado.
      responses:
        '200':
          description: Aprovado; o grupo está `OPEN`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOrganizer' }
        '404': { $ref: '#/components/responses/ExitRequestNotFound' }
        '409':
          description: Pedido já decidido (`/problems/exit-request-not-pending`) ou grupo finalizado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /groups/{groupId}/exit-requests/{requestId}/reject:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [exit-requests]
      summary: Organizador recusa — nada muda no grupo (NOVA — FR-026)
      responses:
        '200':
          description: Recusado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotOrganizer' }
        '404': { $ref: '#/components/responses/ExitRequestNotFound' }
        '409':
          description: Pedido já decidido ou grupo finalizado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /exit-request-notices:
    get:
      tags: [exit-requests]
      summary: Decisões ainda não vistas pelo usuário da sessão (NOVA — FR-026, research R20)
      description: Inclui grupos dos quais a pessoa já saiu (aprovação). Só os pedidos do próprio usuário.
      responses:
        '200':
          description: Lista (vazia se não há avisos)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExitRequestNotice' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /exit-request-notices/{requestId}/ack:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [exit-requests]
      summary: Marca o aviso como visto (NOVA — idempotente)
      responses:
        '204': { description: Marcado }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Pedido inexistente ou de outra pessoa (indistinguíveis)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Sem sessão válida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GroupNotFound:
      description: Grupo inexistente ou usuário não é membro (indistinguíveis de propósito)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ExitRequestNotFound:
      description: Grupo ou pedido inexistente, ou usuário não é membro
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotOrganizer:
      description: Usuário é membro, mas não é o organizador
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GroupFinished:
      description: Grupo finalizado, somente leitura (`/problems/group-finished`, FR-018)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Dados inválidos; `errors` lista os campos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    GroupStatus:
      type: string
      enum: [OPEN, DRAWN, FINISHED]

    EventDetailsRequest:
      type: object
      required: [eventDate, location]
      properties:
        description: { type: [string, 'null'], maxLength: 500, description: 'texto simples; quebras de linha preservadas' }
        eventDate: { type: string, format: date, description: 'AAAA-MM-DD, horário de Brasília; hoje ou futura' }
        eventTime: { type: [string, 'null'], pattern: '^([01]\d|2[0-3]):[0-5]\d$', description: 'HH:mm, opcional' }
        location: { type: string, minLength: 1, maxLength: 120 }

    CreateGroupRequest:
      allOf:
        - $ref: '#/components/schemas/EventDetailsRequest'
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 60 }

    ConfirmationRequest:
      type: object
      required: [detailsVersion]
      properties:
        detailsVersion: { type: integer, minimum: 1, description: 'o valor recebido em GroupDetail.detailsVersion' }

    EventDetails:
      type: object
      required: [eventDate, location]
      properties:
        description: { type: [string, 'null'] }
        eventDate: { type: string, format: date }
        eventTime: { type: [string, 'null'], description: 'HH:mm ou null' }
        location: { type: string }

    GroupSummary:
      type: object
      required: [id, name, status, participantCount, organizer]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: '#/components/schemas/GroupStatus' }
        participantCount: { type: integer }
        organizer: { type: boolean }
        eventDate: { type: [string, 'null'], format: date, description: 'NOVO; null em grupos antigos' }
        eventTime: { type: [string, 'null'], description: NOVO }

    Participant:
      type: object
      required: [userId, name, organizer, confirmed]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        organizer: { type: boolean }
        confirmed: { type: boolean, description: 'NOVO (FR-012)' }

    DrawBlockedReason:
      type: [string, 'null']
      enum: [event-details-required, event-date-passed, not-enough-participants, participants-pending, null]

    GroupDetail:
      type: object
      description: Campos da 001 mais os marcados como NOVO. Nunca contém pares.
      required:
        [id, name, code, status, participants, participantCount, maxParticipants, organizer, canDraw,
         detailsVersion, confirmedCount, myConfirmation, eventDetailsMissing, eventDatePassed]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        status: { $ref: '#/components/schemas/GroupStatus' }
        drawnAt: { type: [string, 'null'], format: date-time }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        participantCount: { type: integer }
        maxParticipants: { type: integer, const: 100 }
        organizer: { type: boolean }
        canDraw: { type: boolean, description: 'ALTERADO: organizador e drawBlockedReason nulo e status OPEN' }
        eventDetails:
          description: 'NOVO; null em grupos antigos ainda sem data e local'
          oneOf:
            - $ref: '#/components/schemas/EventDetails'
            - type: 'null'
        eventDetailsMissing: { type: boolean, description: 'NOVO; grupo antigo sem data e local (FR-034)' }
        eventDatePassed: { type: boolean, description: 'NOVO; status OPEN e o evento já aconteceu (agora ≥ momento de finalizar, research R16; US3-5)' }
        detailsVersion: { type: integer, description: 'NOVO; enviar ao confirmar (FR-035)' }
        confirmedCount: { type: integer, description: NOVO }
        myConfirmation: { type: string, enum: [PENDING, CONFIRMED], description: NOVO }
        drawBlockedReason: { $ref: '#/components/schemas/DrawBlockedReason' }
        finishedAt: { type: [string, 'null'], format: date-time, description: NOVO }
        drawUndone: { type: boolean, description: 'NOVO; status OPEN e o último sorteio foi desfeito por uma saída aprovada' }
        myExitRequest:
          description: 'NOVO; pedido pendente do usuário da sessão, ou null'
          oneOf:
            - $ref: '#/components/schemas/ExitRequest'
            - type: 'null'
        pendingExitRequests:
          type: array
          description: 'NOVO; preenchido só para o organizador (FR-026); vazio para os demais'
          items: { $ref: '#/components/schemas/ExitRequest' }

    ExitRequest:
      type: object
      required: [id, userId, name, requestedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        name: { type: string, description: nome de quem pediu para sair }
        requestedAt: { type: string, format: date-time }

    ExitRequestNotice:
      type: object
      required: [id, groupId, groupName, status, decidedAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        groupName: { type: string }
        status: { type: string, enum: [APPROVED, REJECTED, CANCELLED] }
        decidedAt: { type: string, format: date-time }

    DrawBlockedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            pending:
              type: array
              description: 'só em participants-pending: nomes de quem falta confirmar'
              items: { type: string }

    Problem:
      type: object
      description: RFC 9457
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string, description: mensagem em pt-BR para exibir ao usuário }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
